name: Build TWRP Recovery

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h

      - name: Check Out Device Tree
        uses: actions/checkout@v4
        with:
          path: twrp_device_tree

      - name: Setup Build Tools & Repo
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex g++-multilib gcc-multilib git gnupg gperf libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev libncurses-dev python3
          mkdir -p ~/.bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+rx ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH

      - name: Sync TWRP Minimal Manifest
        run: |
          git config --global user.name "Workflow Builder"
          git config --global user.email "builder@github.com"
          mkdir -p ~/twrp
          cd ~/twrp
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Configure Touch, Drivers & USB
        run: |
          mkdir -p ~/twrp/device/motorola/rhodei
          cp -r ${{ github.workspace }}/twrp_device_tree/* ~/twrp/device/motorola/rhodei/
          rm -f ~/twrp/device/motorola/rhodei/vendorsetup.sh
          rm -f ~/twrp/device/motorola/rhodei/omni_rhodei.mk
          
          # 1. Clean device.mk
          cat << 'EOF' > ~/twrp/device/motorola/rhodei/device.mk
          $(call inherit-product, $(SRC_TARGET_DIR)/product/generic.mk)
          $(call inherit-product, $(SRC_TARGET_DIR)/product/updatable_apex.mk)
          AB_OTA_POSTINSTALL_CONFIG += \
              RUN_POSTINSTALL_system=true \
              POSTINSTALL_PATH_system=system/bin/otapreopt_script \
              FILESYSTEM_TYPE_system=ext4 \
              POSTINSTALL_OPTIONAL_system=true
          PRODUCT_PACKAGES += \
              android.hardware.boot@1.0-impl \
              android.hardware.boot@1.0-service
          EOF

          # 2. Clean twrp_rhodei.mk
          cat << 'EOF' > ~/twrp/device/motorola/rhodei/twrp_rhodei.mk
          $(call inherit-product, $(SRC_TARGET_DIR)/product/base.mk)
          $(call inherit-product, $(SRC_TARGET_DIR)/product/core_64_bit.mk)
          $(call inherit-product, device/motorola/rhodei/device.mk)

          PRODUCT_DEVICE := rhodei
          PRODUCT_NAME := twrp_rhodei
          PRODUCT_BRAND := motorola
          PRODUCT_MODEL := moto g62 5g
          PRODUCT_MANUFACTURER := motorola
          EOF

          # 3. Clean AndroidProducts.mk
          cat << 'EOF' > ~/twrp/device/motorola/rhodei/AndroidProducts.mk
          PRODUCT_MAKEFILES := \
              $(LOCAL_DIR)/twrp_rhodei.mk

          COMMON_LUNCH_CHOICES := \
              twrp_rhodei-eng
          EOF

          # 4. Copy .ko Modules into all recovery ramdisk search paths
          mkdir -p ~/twrp/device/motorola/rhodei/recovery/root/lib/modules
          mkdir -p ~/twrp/device/motorola/rhodei/recovery/root/vendor/lib/modules
          cp -f ~/twrp/device/motorola/rhodei/*.ko ~/twrp/device/motorola/rhodei/recovery/root/lib/modules/ || true
          cp -f ~/twrp/device/motorola/rhodei/*.ko ~/twrp/device/motorola/rhodei/recovery/root/vendor/lib/modules/ || true

          # 5. Inject Touch Drivers into Boot Module Lists
          for f in modules.load modules.load.recovery; do
              touch ~/twrp/device/motorola/rhodei/recovery/root/lib/modules/$f
              echo "mmi_annotate.ko" >> ~/twrp/device/motorola/rhodei/recovery/root/lib/modules/$f
              echo "mmi_info.ko" >> ~/twrp/device/motorola/rhodei/recovery/root/lib/modules/$f
              echo "sensors_class.ko" >> ~/twrp/device/motorola/rhodei/recovery/root/lib/modules/$f
              echo "ili9882_mmi.ko" >> ~/twrp/device/motorola/rhodei/recovery/root/lib/modules/$f
          done

          # Update modules.dep for auto-loading
          cat << 'EOF' >> ~/twrp/device/motorola/rhodei/recovery/root/lib/modules/modules.dep
          ili9882_mmi.ko: sensors_class.ko
          sensors_class.ko:
          mmi_info.ko: mmi_annotate.ko
          mmi_annotate.ko:
          EOF

          # 6. Auto-start Touch & USB via init.recovery.qcom.rc
          cat << 'EOF' >> ~/twrp/device/motorola/rhodei/recovery/root/init.recovery.qcom.rc

          on early-init
              insmod /lib/modules/mmi_annotate.ko
              insmod /lib/modules/mmi_info.ko
              insmod /lib/modules/sensors_class.ko
              insmod /lib/modules/ili9882_mmi.ko

          on boot
              insmod /lib/modules/mmi_annotate.ko
              insmod /lib/modules/mmi_info.ko
              insmod /lib/modules/sensors_class.ko
              insmod /lib/modules/ili9882_mmi.ko
              setprop sys.usb.controller 4e00000.dwc3
              setprop sys.usb.config adb
          EOF

          # 7. Official BoardConfig.mk Flags for Touch & USB
          cat << 'EOF' >> ~/twrp/device/motorola/rhodei/BoardConfig.mk

          # --- Official Touch, Display & USB Controller Configuration ---
          TW_THEME := portrait_hdpi
          TARGET_SCREEN_WIDTH := 1080
          TARGET_SCREEN_HEIGHT := 2400
          TW_INPUT_BLACKLIST := "hbtp_vm hbtp_input"
          TW_SCREEN_BLANK_ON_BOOT := true
          TW_NO_SCREEN_BLANK := true
          TW_STATUS_ICONS_ALIGN := center

          # Qualcomm SM6375 USB Controller for ADB
          TW_USB_CONTROLLER := "4e00000.dwc3"
          TW_EXCLUDE_DEFAULT_USB_INIT := false

          # Official TWRP Module Loader
          TW_LOAD_VENDOR_MODULES := "mmi_annotate.ko mmi_info.ko sensors_class.ko ili9882_mmi.ko"
          TW_LOAD_VENDOR_BOOT_MODULES := true

          BOARD_VENDOR_RAMDISK_KERNEL_MODULES += \
              $(DEVICE_PATH)/mmi_annotate.ko \
              $(DEVICE_PATH)/mmi_info.ko \
              $(DEVICE_PATH)/sensors_class.ko \
              $(DEVICE_PATH)/ili9882_mmi.ko
          EOF

      - name: Compile TWRP Boot Image
        run: |
          cd ~/twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch twrp_rhodei-eng
          mka adbd bootimage -j$(nproc --all)

      - name: Upload Recovery Image
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-MotoG62-rhodei-FinalTouch
          path: /home/runner/twrp/out/target/product/rhodei/*.img
