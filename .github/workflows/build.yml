name: Build TWRP Recovery

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 1024
          swap-size-mb: 10240
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Check Out Device Tree
        uses: actions/checkout@v4
        with:
          path: twrp_device_tree

      - name: Setup Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev \
              libc6-dev-i386 libncurses5 libncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev \
              libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 rsync
          mkdir -p ~/.bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+rx ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH

      - name: Sync TWRP Minimal Manifest
        run: |
          git config --global user.name "Workflow Builder"
          git config --global user.email "builder@github.com"
          mkdir -p /home/runner/work/twrp
          cd /home/runner/work/twrp
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Copy Device Tree
        run: |
          mkdir -p /home/runner/work/twrp/device/motorola/rhodei
          cp -r ${{ github.workspace }}/twrp_device_tree/* /home/runner/work/twrp/device/motorola/rhodei/

      - name: Compile TWRP Boot Image
        run: |
          cd /home/runner/work/twrp
          source build/envsetup.sh
          lunch omni_rhodei-eng || lunch twrp_rhodei-eng
          mka bootimage -j$(nproc --all)

      - name: Upload Recovery Image
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-MotoG62-rhodei
          path: /home/runner/work/twrp/out/target/product/rhodei/*.img
