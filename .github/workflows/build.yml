name: Build TWRP Recovery

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h

      - name: Check Out Device Tree
        uses: actions/checkout@v4
        with:
          path: twrp_device_tree

      - name: Setup Build Tools & Repo
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex g++-multilib gcc-multilib git gnupg gperf libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev libncurses-dev python3
          mkdir -p ~/.bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+rx ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH

      - name: Sync TWRP Minimal Manifest
        run: |
          git config --global user.name "Workflow Builder"
          git config --global user.email "builder@github.com"
          mkdir -p ~/twrp
          cd ~/twrp
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Copy Device Tree & Auto Fix
        run: |
          mkdir -p ~/twrp/device/motorola/rhodei
          cp -r ${{ github.workspace }}/twrp_device_tree/* ~/twrp/device/motorola/rhodei/
          # Ye command us obsolete line ko apne aap delete kar degi:
          sed -i '/PRODUCT_STATIC_BOOT_CONTROL_HAL/d' ~/twrp/device/motorola/rhodei/device.mk
          rm -f ~/twrp/device/motorola/rhodei/vendorsetup.sh

      - name: Compile TWRP Boot Image
        run: |
          cd ~/twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch omni_rhodei-eng || lunch twrp_rhodei-eng
          mka bootimage -j$(nproc --all)

      - name: Upload Recovery Image
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-MotoG62-rhodei
          path: /home/runner/twrp/out/target/product/rhodei/*.img
